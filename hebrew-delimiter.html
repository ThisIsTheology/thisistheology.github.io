<p>Select Hebrew text in Logos, and copy using the <strong>'Text Only'</strong> option.</p>

<div class="delimiter-container">
  <div class="delimiter-grid">
    <div class="delimiter-column">
      <label for="inputText" class="delimiter-label">Hebrew text</label>
      <textarea id="inputText" class="hebrew-box" rows="8" dir="rtl" lang="he" placeholder="Paste Hebrew text from Logos here..."></textarea>
    </div>

    <div class="delimiter-column">
      <label for="outputText" class="delimiter-label">Processed output (logical text order)</label>
      <textarea id="outputText" class="hebrew-box" rows="8" dir="rtl" lang="he" readonly placeholder="Processed output will appear here..."></textarea>
    </div>
  </div>

  <p class="delimiter-note">
    <em>Text can be shown incorrectly; use <strong>RTL Preview</strong> to see correctly formatted text.</em>
  </p>

  <div class="delimiter-buttons">
    <button type="button" id="processButton">Process</button>
    <button type="button" id="clearButton">Clear</button>
    <button type="button" id="saveButton">Save Word</button>
    <button type="button" id="previewButton">RTL Preview</button>
    <button type="button" id="quitButton">Quit</button>
  </div>

  <p id="status" class="delimiter-status" role="status" aria-live="polite"></p>
</div>

<style>

    width: 100%;
    max-width: 1100px;
    margin-top: 1.5rem;
    margin-bottom: 2.5rem;
  }

  .delimiter-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.5rem;
    align-items: start;
  }

  @media (max-width: 850px) {
    .delimiter-grid {
      grid-template-columns: 1fr;
    }
  }

  .delimiter-column {

    flex-direction: column;
  }

  .delimiter-label {
    display: block;
    font-size: 1.25rem;

    margin-top: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .hebrew-box {
    width: 100%;
    box-sizing: border-box;
    padding: 0.85rem;
    font-family: "SBL Hebrew", "Ezra SIL", "Frank Ruhl Libre", "Times New Roman", serif;
    font-size: 1.55rem;
    line-height: 1.9;
    text-align: right;
    direction: rtl;
    unicode-bidi: plaintext;

    border: 1px solid #cccccc;
    border-radius: 3px;

    font-size: 1.15rem;

  }
